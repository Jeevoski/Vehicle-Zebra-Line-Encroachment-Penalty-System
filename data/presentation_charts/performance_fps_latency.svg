<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="1%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="22" font-weight="bold" fill="#0f172a">Pipeline Latency Breakdown (Per Frame)</text>
  <text x="40" y="70" font-size="13" fill="#64748b">Real-time inference profiling | Total: 19.8 ms (~50.5 FPS on GPU) vs 33.3 ms Real-time Target (30 FPS)</text>

  <!-- Real-time Threshold Line -->
  <line x1="560" y1="100" x2="560" y2="380" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" />
  <text x="565" y="115" font-size="11" font-weight="bold" fill="#ef4444">30 FPS Threshold (33.3 ms)</text>

  <!-- Y Axis Labels and Bars -->
  <!-- 1. Screen Capture -->
  <text x="40" y="130" font-size="13" font-weight="600" fill="#1e293b">Screen Capture (MSS)</text>
  <rect x="230" y="115" width="45" height="24" rx="4" fill="url(#barGrad1)" filter="url(#shadow)" />
  <text x="285" y="132" font-size="12" font-weight="bold" fill="#1e293b">2.8 ms (14.1%)</text>

  <!-- 2. YOLOv8n Detection -->
  <text x="40" y="180" font-size="13" font-weight="600" fill="#1e293b">YOLOv8n Vehicle Detect</text>
  <rect x="230" y="165" width="198" height="24" rx="4" fill="#1d4ed8" filter="url(#shadow)" />
  <text x="438" y="182" font-size="12" font-weight="bold" fill="#1e293b">12.4 ms (62.6%)</text>

  <!-- 3. ByteTrack Multi-Object -->
  <text x="40" y="230" font-size="13" font-weight="600" fill="#1e293b">ByteTrack Association</text>
  <rect x="230" y="215" width="50" height="24" rx="4" fill="url(#barGrad1)" filter="url(#shadow)" />
  <text x="290" y="232" font-size="12" font-weight="bold" fill="#1e293b">3.1 ms (15.7%)</text>

  <!-- 4. Traffic Signal Spatial HSV -->
  <text x="40" y="280" font-size="13" font-weight="600" fill="#1e293b">Signal Spatial Analysis</text>
  <rect x="230" y="265" width="19" height="24" rx="4" fill="url(#barGrad1)" filter="url(#shadow)" />
  <text x="260" y="282" font-size="12" font-weight="bold" fill="#1e293b">1.2 ms (6.1%)</text>

  <!-- 5. Zebra Incursion Test -->
  <text x="40" y="330" font-size="13" font-weight="600" fill="#1e293b">Polygon Incursion Check</text>
  <rect x="230" y="315" width="7" height="24" rx="4" fill="url(#barGrad1)" filter="url(#shadow)" />
  <text x="247" y="332" font-size="12" font-weight="bold" fill="#1e293b">0.3 ms (1.5%)</text>

  <!-- Total Summary Card -->
  <rect x="40" y="375" width="720" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="405" font-size="13" fill="#334155"><tspan font-weight="bold" fill="#047857">✓ Real-time Margin:</tspan> Pipeline completes inside 19.8 ms, providing a <tspan font-weight="bold">40.5% safety headroom</tspan> over standard 30 FPS video streams without frame dropping.</text>
</svg>