<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <!-- Title -->
  <text x="35" y="38" font-size="20" font-weight="bold" fill="#0f172a">Confusion Matrix: Traffic Signal State Recognition</text>
  <text x="35" y="60" font-size="13" fill="#64748b">Test Sample Size: N = 1,000 frames under diverse ambient lighting &amp; scenery</text>

  <!-- Axis Titles -->
  <text x="290" y="95" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">PREDICTED SIGNAL STATE</text>
  <text x="30" y="250" font-size="13" font-weight="bold" fill="#475569" transform="rotate(-90 30,250)" text-anchor="middle">ACTUAL (GROUND TRUTH)</text>

  <!-- Column Headers -->
  <text x="210" y="125" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">RED</text>
  <text x="320" y="125" font-size="12" font-weight="bold" fill="#eab308" text-anchor="middle">YELLOW</text>
  <text x="430" y="125" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">GREEN</text>

  <!-- Row 1: Actual RED -->
  <text x="135" y="180" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="end">RED</text>
  <!-- [RED, RED]: 491 (High TP) -->
  <rect x="160" y="140" width="100" height="70" fill="#fee2e2" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="210" y="175" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle">491</text>
  <text x="210" y="195" font-size="10" fill="#b91c1c" text-anchor="middle">98.2% (TP)</text>

  <!-- [RED, YELLOW]: 7 -->
  <rect x="270" y="140" width="100" height="70" fill="#fef9c3" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="320" y="180" font-size="16" font-weight="bold" fill="#854d0e" text-anchor="middle">7</text>

  <!-- [RED, GREEN]: 2 -->
  <rect x="380" y="140" width="100" height="70" fill="#f1f5f9" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="430" y="180" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">2</text>

  <!-- Row 2: Actual YELLOW -->
  <text x="135" y="255" font-size="12" font-weight="bold" fill="#ca8a04" text-anchor="end">YELLOW</text>
  <rect x="160" y="215" width="100" height="70" fill="#f1f5f9" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="210" y="255" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">4</text>
  <rect x="270" y="215" width="100" height="70" fill="#fef08a" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="320" y="250" font-size="18" font-weight="bold" fill="#854d0e" text-anchor="middle">89</text>
  <text x="320" y="270" font-size="10" fill="#854d0e" text-anchor="middle">89.0%</text>
  <rect x="380" y="215" width="100" height="70" fill="#f1f5f9" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="430" y="255" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">7</text>

  <!-- Row 3: Actual GREEN -->
  <text x="135" y="330" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="end">GREEN</text>
  <rect x="160" y="290" width="100" height="70" fill="#f1f5f9" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="210" y="330" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">1</text>
  <rect x="270" y="290" width="100" height="70" fill="#fef9c3" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="320" y="330" font-size="16" font-weight="bold" fill="#854d0e" text-anchor="middle">8</text>
  <rect x="380" y="290" width="100" height="70" fill="#dcfce7" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="430" y="325" font-size="18" font-weight="bold" fill="#166534" text-anchor="middle">391</text>
  <text x="430" y="345" font-size="10" fill="#15803d" text-anchor="middle">97.8% (TP)</text>

  <!-- Summary metrics right side -->
  <rect x="500" y="140" width="170" height="220" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="515" y="170" font-size="13" font-weight="bold" fill="#0f172a">Metrics Summary</text>
  <text x="515" y="200" font-size="11" fill="#475569">Overall Accuracy: <tspan font-weight="bold" fill="#16a34a">97.1%</tspan></text>
  <text x="515" y="225" font-size="11" fill="#475569">Red Precision: <tspan font-weight="bold" fill="#0f172a">99.0%</tspan></text>
  <text x="515" y="250" font-size="11" fill="#475569">Red Recall: <tspan font-weight="bold" fill="#0f172a">98.2%</tspan></text>
  <text x="515" y="275" font-size="11" fill="#475569">Red Light F1: <tspan font-weight="bold" fill="#2563eb">98.6%</tspan></text>
  <text x="515" y="305" font-size="11" fill="#475569">Crit. False Green: <tspan font-weight="bold" fill="#dc2626">0.4%</tspan></text>
  <text x="515" y="335" font-size="10" fill="#64748b">(Severe failure safety)</text>
</svg>